<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BOARDSCOUT의 전체 보드게임을 한국어로 둘러보고 검색합니다." />
    <title>전체 게임 — BOARDSCOUT</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="app-page">
    <a class="skip-link" href="#main">본문으로 바로가기</a>
    <header class="site-header">
      <a class="brand" href="/" aria-label="BOARDSCOUT 홈">BOARD<span>SCOUT</span></a>
      <nav class="main-nav" aria-label="주요 메뉴">
        <a href="/preferences.html">게임 추천</a>
        <a href="/games.html" aria-current="page">전체 게임</a>
        <a href="/taste.html">내 취향 추천</a>
        <a href="/mypage.html">저장한 게임</a>
      </nav>
      <div class="header-actions">
        <a class="text-button" href="/login.html">로그인</a>
        <button class="menu-button" id="menuButton" type="button" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span></button>
      </div>
    </header>
    <main id="main" class="page-shell catalog-page">
      <p class="page-kicker">모든 보드게임</p>
      <h1 class="page-title">다음에 펼칠 게임을<br /><em>천천히 둘러보세요.</em></h1>
      <p class="page-lead">이름으로 찾거나 목록을 이어서 불러올 수 있습니다. 페이지 번호 대신 마지막 게임을 기준으로 다음 목록을 가져옵니다.</p>

      <form class="catalog-search" id="catalogSearch" role="search">
        <label for="catalogQuery">게임 이름</label>
        <div>
          <input id="catalogQuery" type="search" placeholder="한글 또는 영문 게임 이름" autocomplete="off" maxlength="100" />
          <button class="primary-button" type="submit">검색하기</button>
        </div>
      </form>

      <p class="catalog-status" id="catalogStatus" role="status" aria-live="polite">게임 목록을 불러오고 있습니다…</p>
      <section class="catalog-grid" id="catalogGrid" aria-label="전체 게임 목록"></section>
      <div class="catalog-more">
        <button class="secondary-button" id="loadMore" type="button" hidden>게임 더 보기</button>
      </div>
    </main>
    <script type="module" src="/js/pages/games.js"></script>
  </body>
</html>
