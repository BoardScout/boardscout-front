<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="좋아했던 보드게임을 골라 비슷한 취향의 게임 추천 받기" />
    <title>내 취향으로 추천 — BOARDSCOUT</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="app-page">
    <a class="skip-link" href="#main">본문으로 바로가기</a>
    <header class="site-header"><a class="brand" href="/" aria-label="BOARDSCOUT 홈">BOARD<span>SCOUT</span></a><nav class="main-nav" aria-label="주요 메뉴"><a href="/preferences.html">게임 추천</a><a href="/games.html">전체 게임</a><a href="/taste.html">내 취향 추천</a><a href="/mypage.html">저장한 게임</a></nav><div class="header-actions"><a class="text-button" href="/preferences.html">상황으로 찾기</a><button class="menu-button" id="menuButton" type="button" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span></button></div></header>
    <main id="main" class="page-shell">
      <p class="page-kicker">내 취향으로 · 게임 프로필 기반</p>
      <h1 class="page-title">재미있게 했던 게임을<br /><em>세 개 이상 골라주세요.</em></h1>
      <p class="page-lead">BGG의 같은 게임 ID를 기준으로 테마, 메커니즘, 복잡도가 가까운 게임을 찾습니다. 선택한 게임은 추천 결과에서 제외합니다.</p>
      <form id="tasteForm" class="taste-form">
        <div class="taste-toolbar">
          <label class="taste-search"><span class="sr-only">게임 검색</span><input id="gameSearch" type="search" placeholder="게임 이름 검색" autocomplete="off" maxlength="100" /></label>
          <p><b id="selectedCount">0</b>개 선택 · 3–20개</p>
        </div>
        <div class="game-picker" id="gamePicker" aria-label="좋아한 게임 선택"></div>
        <div class="catalog-more"><button class="secondary-button" id="loadMore" type="button" hidden>게임 더 보기</button></div>
        <div class="form-actions taste-actions"><button class="primary-button" id="tasteSubmit" type="submit" disabled>내 취향 추천 보기</button><a class="text-link" href="/preferences.html">지금 상황으로 찾기</a></div>
        <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="/js/pages/taste.js"></script>
  </body>
</html>
