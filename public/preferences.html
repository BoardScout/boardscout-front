<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="인원, 시간, 난이도, 테마, 플레이 방식으로 지금 할 보드게임 찾기" />
    <title>지금 상황으로 추천 — BOARDSCOUT</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="app-page">
    <a class="skip-link" href="#main">본문으로 바로가기</a>
    <header class="site-header"><a class="brand" href="/" aria-label="BOARDSCOUT 홈">BOARD<span>SCOUT</span></a><nav class="main-nav" aria-label="주요 메뉴"><a href="/preferences.html">게임 추천</a><a href="/games.html">전체 게임</a><a href="/taste.html">내 취향 추천</a><a href="/mypage.html">관심 게임</a></nav><div class="header-actions"><button class="menu-button" id="menuButton" type="button" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span></button></div></header>
    <main id="main" class="page-shell">
      <h1 class="page-title">지금 펼칠 게임을<br /><em>다섯 가지 선택으로.</em></h1>
      <p class="page-lead">인원과 시간이 맞는 게임 가운데 난이도와 테마가 가까운 순서로 보여 드려요.</p>
      <form id="preferenceForm" class="page-grid">
        <div class="panel">
          <div class="field"><span>01 · 몇 명이 플레이하나요?</span><div class="choice-grid choice-grid--three">
            <label class="choice"><input type="radio" name="playerCount" value="1" required /><span>혼자<small>솔로 플레이</small></span></label>
            <label class="choice"><input type="radio" name="playerCount" value="2" /><span>2명<small>둘이 마주 앉아</small></span></label>
            <label class="choice"><input type="radio" name="playerCount" value="3" /><span>3명<small>작은 테이블</small></span></label>
            <label class="choice"><input type="radio" name="playerCount" value="4" /><span>4명<small>가장 넓은 선택지</small></span></label>
            <label class="choice"><input type="radio" name="playerCount" value="6" /><span>5–6명<small>모임과 파티</small></span></label>
            <label class="choice"><input type="radio" name="playerCount" value="8" /><span>7명 이상<small>큰 그룹</small></span></label>
          </div></div>
          <div class="field"><span>02 · 최대 몇 분까지 괜찮나요?</span><div class="choice-grid">
            <label class="choice"><input type="radio" name="maxPlayTime" value="30" required /><span>30분<small>빠르게 한 판</small></span></label>
            <label class="choice"><input type="radio" name="maxPlayTime" value="60" /><span>60분<small>부담 없는 몰입</small></span></label>
            <label class="choice"><input type="radio" name="maxPlayTime" value="90" /><span>90분<small>전략을 펼치기</small></span></label>
            <label class="choice"><input type="radio" name="maxPlayTime" value="120" /><span>120분 이상<small>긴 호흡의 게임</small></span></label>
          </div></div>
          <div class="field"><span>03 · 어느 정도 복잡한 게임을 원하나요?</span><div class="choice-grid choice-grid--three">
            <label class="choice"><input type="radio" name="difficulty" value="1" required /><span>가볍게<small>규칙이 쉬운 편</small></span></label>
            <label class="choice"><input type="radio" name="difficulty" value="2" /><span>적당히<small>몇 판이면 익숙해져요</small></span></label>
            <label class="choice"><input type="radio" name="difficulty" value="3" /><span>깊게<small>익히는 데 시간이 걸려요</small></span></label>
          </div></div>
        </div>
        <div class="panel">
          <div class="field"><span>04 · 어떤 테마가 끌리나요? (복수 선택)</span><div class="choice-grid">
            <label class="choice"><input type="checkbox" name="themes" value="strategy" /><span>전략·경영<small>한 수 앞과 자원 운영</small></span></label>
            <label class="choice"><input type="checkbox" name="themes" value="party" /><span>파티·심리전<small>웃음과 눈치 싸움</small></span></label>
            <label class="choice"><input type="checkbox" name="themes" value="adventure" /><span>판타지·모험<small>탐험과 성장</small></span></label>
            <label class="choice"><input type="checkbox" name="themes" value="mystery" /><span>추리·공포<small>단서와 긴장감</small></span></label>
            <label class="choice"><input type="checkbox" name="themes" value="scifi" /><span>SF·우주<small>미래와 우주 개발</small></span></label>
            <label class="choice"><input type="checkbox" name="themes" value="family" /><span>가족·어린이<small>세대가 함께 편하게</small></span></label>
            <label class="choice"><input type="checkbox" name="themes" value="history" /><span>역사·문명<small>시대와 문명 발전</small></span></label>
            <label class="choice"><input type="checkbox" name="themes" value="building" /><span>건설·경제<small>도시와 엔진 만들기</small></span></label>
          </div></div>
          <div class="field"><span>05 · 어떤 플레이 감각이 좋은가요? (선택)</span><div class="choice-grid">
            <label class="choice"><input type="checkbox" name="playStyles" value="coop" /><span>함께 협력하기<small>같은 목표를 해결</small></span></label>
            <label class="choice"><input type="checkbox" name="playStyles" value="social" /><span>대화·추리하기<small>설명, 협상, 심리전</small></span></label>
            <label class="choice"><input type="checkbox" name="playStyles" value="engine" /><span>전략을 쌓아가기<small>자원과 조합의 성장</small></span></label>
            <label class="choice"><input type="checkbox" name="playStyles" value="luck" /><span>주사위와 운<small>예측 못 한 반전</small></span></label>
            <label class="choice"><input type="checkbox" name="playStyles" value="puzzle" /><span>퍼즐·타일 배치<small>공간을 채우는 재미</small></span></label>
            <label class="choice"><input type="checkbox" name="playStyles" value="solo" /><span>혼자 플레이하기<small>내 속도로 생각하기</small></span></label>
          </div></div>
          <div class="form-actions"><button class="primary-button" type="submit">지금 할 게임 보기</button><a class="text-link" href="/taste.html">취향으로 추천받기</a></div>
          <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
          <div class="stepper" aria-label="상황 추천 2단계 중 1단계"><span class="is-active"></span><span></span></div>
        </div>
      </form>
    </main>
    <script type="module" src="/js/pages/preferences.js"></script>
  </body>
</html>
