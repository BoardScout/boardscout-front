<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="인원, 시간, 난이도, 장르로 보드게임 취향 설정" />
    <title>취향 설정 — BOARDSCOUT</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="app-page">
    <a class="skip-link" href="#main">본문으로 바로가기</a>
    <header class="site-header"><a class="brand" href="/" aria-label="BOARDSCOUT 홈">BOARD<span>SCOUT</span></a><nav class="main-nav" aria-label="주요 메뉴"><a href="/preferences.html">RECOMMEND</a><a href="/recommendations.html">GAMES</a><a href="/mypage.html">MY PAGE</a></nav><div class="header-actions"><a class="text-button" href="/mypage.html">MY PAGE</a><button class="menu-button" id="menuButton" type="button" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span></button></div></header>
    <main id="main" class="page-shell">
      <p class="page-kicker">TELL US ABOUT TONIGHT</p>
      <h1 class="page-title">오늘 밤에 맞는 게임을<br /><em>네 가지 질문으로.</em></h1>
      <p class="page-lead">정답은 없습니다. 지금 함께하는 사람과 가능한 시간에 가장 가까운 것을 고르세요.</p>
      <form id="preferenceForm" class="page-grid">
        <div class="panel">
          <div class="field"><span>01 · 몇 명이 함께하나요?</span><div class="choice-grid">
            <label class="choice"><input type="radio" name="players" value="2" required /><span>둘이서<small>차분한 맞대결</small></span></label>
            <label class="choice"><input type="radio" name="players" value="3" /><span>세 명<small>균형 잡힌 테이블</small></span></label>
            <label class="choice"><input type="radio" name="players" value="4" /><span>네 명<small>협력과 경쟁 사이</small></span></label>
            <label class="choice"><input type="radio" name="players" value="6" /><span>다섯 명 이상<small>대화가 많은 파티</small></span></label>
          </div></div>
          <div class="field"><span>02 · 가능한 시간은?</span><div class="choice-grid">
            <label class="choice"><input type="radio" name="minutes" value="30" required /><span>30분 안쪽<small>가볍게 한 판</small></span></label>
            <label class="choice"><input type="radio" name="minutes" value="60" /><span>한 시간<small>몰입하기 좋은 길이</small></span></label>
            <label class="choice"><input type="radio" name="minutes" value="120" /><span>두 시간 이상<small>긴 호흡의 게임</small></span></label>
          </div></div>
        </div>
        <div class="panel">
          <div class="field"><span>03 · 어느 정도 생각하고 싶나요?</span><div class="choice-grid">
            <label class="choice"><input type="radio" name="difficulty" value="1" required /><span>가볍게<small>설명 5분 안쪽</small></span></label>
            <label class="choice"><input type="radio" name="difficulty" value="2" /><span>적당히<small>선택의 재미</small></span></label>
            <label class="choice"><input type="radio" name="difficulty" value="3" /><span>깊게<small>전략적인 밤</small></span></label>
          </div></div>
          <div class="field"><span>04 · 끌리는 장르는? (복수 선택)</span><div class="choice-grid">
            <label class="choice"><input type="checkbox" name="genres" value="strategy" /><span>전략<small>한 수 앞을 읽기</small></span></label>
            <label class="choice"><input type="checkbox" name="genres" value="mystery" /><span>추리<small>단서를 함께 연결하기</small></span></label>
            <label class="choice"><input type="checkbox" name="genres" value="coop" /><span>협력<small>같은 편이 되는 밤</small></span></label>
            <label class="choice"><input type="checkbox" name="genres" value="party" /><span>파티<small>웃음과 대화 중심</small></span></label>
          </div></div>
          <input type="hidden" name="mood" value="night" />
          <div class="form-actions"><button class="primary-button" type="submit">추천 결과 보기</button><a class="text-link" href="/">나중에 하기</a></div>
          <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
          <div class="stepper" aria-label="추천 과정 2단계 중 1단계"><span class="is-active"></span><span></span></div>
        </div>
      </form>
    </main>
    <script type="module" src="/js/pages/preferences.js"></script>
  </body>
</html>
