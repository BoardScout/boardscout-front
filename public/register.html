<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BOARDSCOUT 회원가입" />
    <title>회원가입 — BOARDSCOUT</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="app-page">
    <a class="skip-link" href="#main">본문으로 바로가기</a>
    <header class="site-header"><a class="brand" href="/" aria-label="BOARDSCOUT 홈">BOARD<span>SCOUT</span></a><nav class="main-nav" aria-label="주요 메뉴"><a href="/preferences.html">RIGHT NOW</a><a href="/taste.html">MY TASTE</a><a href="/mypage.html">MY PAGE</a></nav><div class="header-actions"><a class="text-button" href="/login.html">LOGIN</a><button class="menu-button" id="menuButton" type="button" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span></button></div></header>
    <main id="main" class="page-shell">
      <p class="page-kicker">CREATE YOUR TABLE</p>
      <h1 class="page-title">당신의 취향으로<br /><em>첫 판을 시작해요.</em></h1>
      <div class="page-grid">
        <form class="panel" id="registerForm">
          <h2 class="panel-title">새 계정 만들기</h2>
          <div class="field"><label for="name">이름</label><input id="name" name="name" autocomplete="name" required /></div>
          <div class="field"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" minlength="4" required /></div>
          <div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required /></div>
          <div class="field"><label for="passwordConfirm">비밀번호 확인</label><input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" required /></div>
          <p class="field-hint">비밀번호는 8자 이상으로 입력해 주세요.</p>
          <div class="form-actions"><button class="primary-button" type="submit">가입하고 취향 고르기</button><a class="text-link" href="/login.html">이미 계정이 있어요</a></div>
          <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
        </form>
        <aside class="auth-aside"><h2>Pick less.<br />Play better.</h2><p>지금의 인원과 시간으로 찾거나, 좋아한 게임 세 개로 취향을 만들 수 있습니다.</p></aside>
      </div>
    </main>
    <script type="module" src="/js/pages/register.js"></script>
  </body>
</html>
