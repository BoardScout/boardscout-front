<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BOARDSCOUT 로그인" />
    <title>로그인 — BOARDSCOUT</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="app-page night">
    <a class="skip-link" href="#main">본문으로 바로가기</a>
    <header class="site-header" id="siteHeader">
      <a class="brand" href="/" aria-label="BOARDSCOUT 홈">BOARD<span>SCOUT</span></a>
      <nav class="main-nav" aria-label="주요 메뉴"><a href="/preferences.html">게임 추천</a><a href="/games.html">전체 게임</a><a href="/taste.html">내 취향 추천</a><a href="/mypage.html">관심 게임</a></nav>
      <div class="header-actions"><a class="text-button" href="/register.html">회원가입</a><button class="menu-button" id="menuButton" type="button" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span></button></div>
    </header>
    <main id="main" class="page-shell">
      <p class="page-kicker">다시 오신 것을 환영해요</p>
      <h1 class="page-title">당신의 게임 목록이,<br /><em>기다리고 있어요.</em></h1>
      <div class="page-grid">
        <form class="panel" id="loginForm">
          <h2 class="panel-title">계정으로 로그인</h2>
          <div class="field"><label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="email" required /></div>
          <div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required /></div>
          <p class="field-hint">서버 연결 전에도 데모 모드로 전체 추천 흐름을 확인할 수 있습니다.</p>
          <div class="form-actions"><button class="primary-button" type="submit">로그인</button><a class="text-link" href="/register.html">처음 오셨나요?</a></div>
          <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
        </form>
        <aside class="auth-aside"><h2>고른 게임을<br />기억할게요.</h2><p>저장한 취향과 게임을 다음 방문에도 그대로 이어서 볼 수 있습니다.</p></aside>
      </div>
    </main>
    <script type="module" src="/js/pages/login.js"></script>
  </body>
</html>
